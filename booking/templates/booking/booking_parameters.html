{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card border-0">
                <div class="card-header bg-dark text-center py-4">
                    <h2 class="mb-0 text-light">
                        <i class="bi bi-calendar-plus me-2"></i>Параметры бронирования
                    </h2>
                </div>
                <div class="card-body bg-secondary bg-opacity-10">
                    <form method="post">
                        {% csrf_token %}
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-light">Дата бронирования</label>
                                {{ form.reservation_date }}
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-light">Время начала</label>
                                {{ form.start_time }}
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-light">Количество гостей</label>
                                {{ form.guests_count }}
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label text-light">Длительность (часы)</label>
                                {{ form.duration }}
                            </div>
                        </div>
                        
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary py-2">
                                <i class="bi bi-search me-2"></i>Найти свободные столики
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
