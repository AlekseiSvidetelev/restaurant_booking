{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-dark text-white">
                    <h4 class="mb-0">Бронирование столика</h4>
                </div>
                <div class="card-body">
                    <form method="post">
                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label">Дата</label>
                            {{ form.reservation_date }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Время</label>
                            {{ form.start_time }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Количество гостей</label>
                            {{ form.guests_count }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Длительность (часы)</label>
                            {{ form.duration }}
                        </div>

                        <button type="submit" class="btn btn-primary w-100">
                            Найти свободные столики
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
