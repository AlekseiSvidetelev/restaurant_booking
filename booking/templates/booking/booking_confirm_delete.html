{% extends 'base.html' %}
{% block title %}Отмена бронирования{% endblock %}

{% block content %}
<section class="container py-5">
  <div class="card card-glass" style="max-width:500px;margin:auto">
    <div class="card-body text-center">
      <h1 class="h5 mb-3">Отменить бронирование <strong>#{{ booking.id }}</strong>?</h1>
      <p class="text-white-50 mb-4">Это действие необратимо.</p>

      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 justify-content-center">
          <button type="submit" class="btn btn-danger">Отменить</button>
          <a href="{% url 'booking:booking_detail' booking.id %}" class="btn btn-outline-light">Назад</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
