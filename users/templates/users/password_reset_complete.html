{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-header bg-success text-white text-center py-3">
                    <h4><i class="bi bi-check-circle me-2"></i>Пароль успешно изменен</h4>
                </div>
                <div class="card-body p-4 text-center">
                    <div class="my-4">
                        <i class="bi bi-shield-check display-1 text-success mb-4"></i>
                        <h3 class="mb-3">Пароль обновлён!</h3>
                        <p class="fs-5">Ваш пароль был успешно изменён.</p>
                        <p class="fs-5">Теперь вы можете войти в систему с новым паролем.</p>
                    </div>

                    <div class="d-grid mt-4">
                        <a href="{% url 'users:login' %}" class="btn btn-primary btn-lg py-3">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Войти в систему
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
