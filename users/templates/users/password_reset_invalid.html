{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4">
                <div class="card-header bg-danger text-white text-center py-3">
                    <h4><i class="bi bi-exclamation-triangle me-2"></i>Недействительная ссылка</h4>
                </div>
                <div class="card-body p-4 text-center">
                    <div class="my-4">
                        <i class="bi bi-link-45deg-slash display-1 text-danger mb-4"></i>
                        <h3 class="mb-3">Ссылка недействительна</h3>
                        <p class="fs-5">Ссылка для сброса пароля недействительна или уже была использована.</p>
                        <p class="fs-5">Пожалуйста, запросите новый запрос на сброс пароля.</p>
                    </div>

                    <div class="d-grid gap-3 mt-4">
                        <a href="{% url 'users:password_reset_request' %}" class="btn btn-primary btn-lg py-3">
                            <i class="bi bi-arrow-repeat me-2"></i>Запросить новую ссылку
                        </a>
                        <a href="{% url 'users:login' %}" class="btn btn-outline-secondary btn-lg py-2">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Вернуться к входу
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
