{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card border-danger card-hover m-4 p-4 shadow rounded-4">
            <div class="card-body text-center">
                <i class="bi bi-door-open display-4 text-danger mb-4"></i>
                <h4 class="card-title mb-4">Выход из системы</h4>

                <p class="card-text fw-bold text-danger fs-5 mb-4">
                    Вы уверены, что хотите выйти из аккаунта?
                </p>

                <form method="post" action="{% url 'users:logout' %}">
                    {% csrf_token %}
                    <div class="d-grid gap-3 mt-4">
                        <button type="submit" class="btn btn-lg btn-danger py-3">
                            <i class="bi bi-box-arrow-right me-2"></i>Да, выйти
                        </button>

                        <a href="{% url 'booking:home' %}" class="btn btn-primary py-3">
                            <i class="bi bi-person-check me-2"></i>Нет, остаться
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
