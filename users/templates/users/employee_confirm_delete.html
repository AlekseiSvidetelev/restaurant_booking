{% extends 'base.html' %}
{% block title %}Удалить сотрудника{% endblock %}

{% block content %}
<section class="container py-5">
  <div class="card card-glass" style="max-width:500px;margin:auto">
    <div class="card-body text-center">
      <h1 class="h5 mb-3">Вы собираетесь удалить сотрудника
          <strong>{{ object.first_name }} {{ object.last_name }}</strong>.
      </h1></strong></h1>
      <p class="text-white-50 mb-4">Это действие необратимо.</p>
      <form method="post">
        {% csrf_token %}
        <div class="d-flex gap-2 justify-content-center">
          <button type="submit" class="btn btn-danger">Удалить</button>
          <a href="{% url 'users:employee_detail' object.pk %}" class="btn btn-outline-light">Отмена</a>
        </div>
      </form>
    </div>
  </div>
</section>
{% endblock %}
